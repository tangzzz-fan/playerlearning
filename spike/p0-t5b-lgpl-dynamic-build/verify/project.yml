name: P0T5BVerify
options:
  bundleIdPrefix: com.p0t5b.verify
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LocalLibmpv:
    path: ./LocalLibmpv
targets:
  P0T5BVerify:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../p0-t5a-libmpv-smoke/Resources
    dependencies:
      - package: LocalLibmpv
        product: Libmpv
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: P0T5BVerify
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p0t5b.verify
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3GMJYX32U9
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
