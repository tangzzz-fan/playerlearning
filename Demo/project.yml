name: PlayerStackDemo
options:
  bundleIdPrefix: com.playerstack
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  PlayerStack:
    path: ..
  # libmpv 适配器（`PlayerMPV`）现在是**根包的一个 product**，不再是独立子包 ——
  # SPM 的 `url:` 依赖只读仓库根清单，子目录包对外部消费者不可见（`docs/30` A1）。
targets:
  PlayerStackDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: PlayerStack
        product: PlayerCore
      - package: PlayerStack
        product: PlayerUI
      - package: PlayerStack
        product: PlayerMPV
      # 处理器参考实现（LUT）。`-renderLUT` 那个调试入口用它。
      - package: PlayerStack
        product: PlayerProcessors
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PlayerStack
        # 版本号**只有一个源**（下面的 MARKETING_VERSION / CURRENT_PROJECT_VERSION）——
        # 写死在这里会出现"改了一处、另一处没改"的经典不一致（`P-085` 同族）。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # ⚠️ **少了这个 key，App 连不到局域网里的任何地址**（实测：真机直连宿主机的
        #    `http://192.168.x.x:8765/…` 在 **6 毫秒**内报 `tcp: … failed: No route to host`
        #    —— 包根本没发出去；Mac 侧防火墙是关的、服务也确实在 `*:8765` 上监听）。
        #    iOS 14+ 把"访问本地网络"变成了一项**用户授权**，没有用途说明就没有授权入口。
        #    这**不只是演示需要**：局域网 NAS / 自建 HTTP 源是播放器的常见来源，
        #    产品在第一次做局域网点播时同样必须有它。
        NSLocalNetworkUsageDescription: 用于播放局域网内的视频源（NAS / 自建 HTTP 服务器）。
        # 导出合规：App 只用系统 TLS（HTTPS / TLS 直播），不含自研或非豁免加密 ⇒
        # 声明 false 可免掉每次上传都手工回答"是否使用加密"（答错会被要求补材料）。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # 上架用的正式 bundle id（`docs/23`）：App Store 上**首次上传后不可更改**，
        # 所以别再用带 `.demo` 的临时值。
        PRODUCT_BUNDLE_IDENTIFIER: com.playerstack.app
        # 首版**只上 iPhone**（`TARGETED_DEVICE_FAMILY: "1"`）。
        # 原因不是偷懒：iPad 布局从未验证过，而声明支持 iPad 会让 App Store 要求
        # iPad 截图 + iPad 上要说得过去；改成 "1,2" 是一行的事，但要先补 iPad 验证。
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        # 填你自己的 Apple Developer Team ID（`security find-identity -v -p codesigning` 可查），
        # 或用命令行覆盖：xcodebuild … DEVELOPMENT_TEAM=<你的 team>
        # 留空时 Xcode 走自动签名，前提是本机已登录开发者账号。
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PlayerStackDemo-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: PlayerStack
        product: PlayerCore
      - package: PlayerStack
        product: PlayerUI
      - package: PlayerStack
        product: PlayerMPV
    info:
      # ⚠️ **两个 target 不能共用同一个 `Info.plist` 路径**：xcodegen 会**都往同一个文件写**，
      #    后写的那份**整个覆盖**前一份（不合并、不报错）。
      #    实测（2026-10-15）：加了 macOS target 之后，生成出来的 `Demo/Info.plist` 里只剩
      #    macOS 的 `LSMinimumSystemVersion`，**iOS 的 `UISupportedInterfaceOrientations`
      #    与 `UILaunchScreen` 全没了** —— 而 iOS 侧一切"照常能跑"，只有打包出来的包是坏的
      #    （横屏支持与启动屏配置静默丢失）。这类错误**不报错，只表现为配置不见了**。
      path: Info-macOS.plist
      properties:
        CFBundleDisplayName: PlayerStack
        LSMinimumSystemVersion: "14.0"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerstack.app
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # ⚠️ UI 自动化**刻意用 XCTest**：`XCUIApplication` 在 Swift Testing 里没有等价能力 ——
  #    这是工具边界，不是"忘了迁移"（先例：`docs/03` L457–458 · `docs/11` L41–45）。
  # 2026-10-16 恢复：此前随自动门禁一并移除（`docs/03` L440–442），
  #    董事长决定加回来 —— 目的是**减少手动测试**，并配合模拟器截图取证。
  PlayerStackDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PlayerStackDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerstack.app.uitests
        SWIFT_VERSION: "6.0"
        # 填你自己的 Apple Developer Team ID（`security find-identity -v -p codesigning` 可查），
        # 或用命令行覆盖：xcodebuild … DEVELOPMENT_TEAM=<你的 team>
        # 留空时 Xcode 走自动签名，前提是本机已登录开发者账号。
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # ⚠️ **必须显式打开**：xcodegen 不会给 `bundle.ui-testing` target 生成 Info.plist
        #    （app target 有 `info.path`，测试 bundle 没有）⇒ 报
        #    「Cannot code sign because the target does not have an Info.plist file」。
        #    注意**别**给它指定 `info.path` —— 那会踩 `P-057`（两个 target 抢同一个 plist，
        #    后写的整个覆盖前一份）。让 Xcode 现生成才是这条路。
        GENERATE_INFOPLIST_FILE: YES
schemes:
  # xcodegen 默认**不生成** scheme，必须显式声明，否则 xcodebuild -scheme / CI 都用不了。
  PlayerStackDemo:
    build:
      targets:
        PlayerStackDemo: all
        PlayerStackDemoUITests: [test]
    test:
      config: Debug
      targets:
        - PlayerStackDemoUITests
    run:
      config: Debug
    archive:
      config: Release
  PlayerStackDemo-macOS:
    build:
      targets:
        PlayerStackDemo-macOS: all
    run:
      config: Debug
    archive:
      config: Release
