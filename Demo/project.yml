name: PlayerStackDemo
options:
  bundleIdPrefix: com.playerstack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PlayerStack:
    path: ..
targets:
  PlayerStackDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: PlayerStack
        product: PlayerCore
      - package: PlayerStack
        product: PlayerUI
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PlayerStack
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerstack.demo
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: 3GMJYX32U9
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
