name: PlayerStackDemo
options:
  bundleIdPrefix: com.playerstack
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  PlayerStack:
    path: ..
  # libmpv 适配器是**独立包**（仅 iOS 编译）⇒ Demo 必须显式依赖它，
  # 否则端到端到不了"真画面"（`P2-T10`；根包不引用 libmpv 是刻意约束，见 docs/03）。
  PlayerMPV:
    path: ../MPV
targets:
  PlayerStackDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: PlayerStack
        product: PlayerCore
      - package: PlayerStack
        product: PlayerUI
      - package: PlayerMPV
        product: PlayerMPV
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PlayerStack
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # ⚠️ **少了这个 key，App 连不到局域网里的任何地址**（实测：真机直连宿主机的
        #    `http://192.168.x.x:8765/…` 在 **6 毫秒**内报 `tcp: … failed: No route to host`
        #    —— 包根本没发出去；Mac 侧防火墙是关的、服务也确实在 `*:8765` 上监听）。
        #    iOS 14+ 把"访问本地网络"变成了一项**用户授权**，没有用途说明就没有授权入口。
        #    这**不只是演示需要**：局域网 NAS / 自建 HTTP 源是播放器的常见来源，
        #    产品在第一次做局域网点播时同样必须有它。
        NSLocalNetworkUsageDescription: 用于播放局域网内的视频源（NAS / 自建 HTTP 服务器）。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerstack.demo
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: UKXWZ3FS84
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  PlayerStackDemo-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: PlayerStack
        product: PlayerCore
      - package: PlayerStack
        product: PlayerUI
      - package: PlayerMPV
        product: PlayerMPV
    info:
      # ⚠️ **两个 target 不能共用同一个 `Info.plist` 路径**：xcodegen 会**都往同一个文件写**，
      #    后写的那份**整个覆盖**前一份（不合并、不报错）。
      #    实测（2026-10-15）：加了 macOS target 之后，生成出来的 `Demo/Info.plist` 里只剩
      #    macOS 的 `LSMinimumSystemVersion`，**iOS 的 `UISupportedInterfaceOrientations`
      #    与 `UILaunchScreen` 全没了** —— 而 iOS 侧一切"照常能跑"，只有打包出来的包是坏的
      #    （横屏支持与启动屏配置静默丢失）。这类错误**不报错，只表现为配置不见了**。
      path: Info-macOS.plist
      properties:
        CFBundleDisplayName: PlayerStack
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerstack.demo
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  # ⚠️ UI 自动化**刻意用 XCTest**：`XCUIApplication` 在 Swift Testing 里没有等价能力 ——
  #    这是工具边界，不是"忘了迁移"（先例：`docs/03` L457–458 · `docs/11` L41–45）。
  # 2026-10-16 恢复：此前随自动门禁一并移除（`docs/03` L440–442），
  #    董事长决定加回来 —— 目的是**减少手动测试**，并配合模拟器截图取证。
  PlayerStackDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PlayerStackDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerstack.demo.uitests
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: UKXWZ3FS84
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # ⚠️ **必须显式打开**：xcodegen 不会给 `bundle.ui-testing` target 生成 Info.plist
        #    （app target 有 `info.path`，测试 bundle 没有）⇒ 报
        #    「Cannot code sign because the target does not have an Info.plist file」。
        #    注意**别**给它指定 `info.path` —— 那会踩 `P-057`（两个 target 抢同一个 plist，
        #    后写的整个覆盖前一份）。让 Xcode 现生成才是这条路。
        GENERATE_INFOPLIST_FILE: YES
schemes:
  # xcodegen 默认**不生成** scheme，必须显式声明，否则 xcodebuild -scheme / CI 都用不了。
  PlayerStackDemo:
    build:
      targets:
        PlayerStackDemo: all
        PlayerStackDemoUITests: [test]
    test:
      config: Debug
      targets:
        - PlayerStackDemoUITests
    run:
      config: Debug
    archive:
      config: Release
  PlayerStackDemo-macOS:
    build:
      targets:
        PlayerStackDemo-macOS: all
    run:
      config: Debug
    archive:
      config: Release
