name: PlayerStackDemo
options:
  bundleIdPrefix: com.playerstack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PlayerStack:
    path: ..
  # libmpv 适配器是**独立包**（仅 iOS 编译）⇒ Demo 必须显式依赖它，
  # 否则端到端到不了"真画面"（`P2-T10`；根包不引用 libmpv 是刻意约束，见 docs/03）。
  PlayerMPV:
    path: ../MPV
targets:
  PlayerStackDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: PlayerStack
        product: PlayerCore
      - package: PlayerStack
        product: PlayerUI
      - package: PlayerMPV
        product: PlayerMPV
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PlayerStack
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerstack.demo
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: 3GMJYX32U9
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  # G3 的 UI 自动化。（xcodegen 需要显式声明 target，且**新增文件后要重新 generate**。）
  PlayerStackDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PlayerStackDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerstack.demo.uitests
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: 3GMJYX32U9
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: PlayerStackDemo
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # xcodegen 默认**不生成** scheme，必须显式声明，否则 xcodebuild -scheme / CI 都用不了。
  PlayerStackDemo:
    build:
      targets:
        PlayerStackDemo: all
        PlayerStackDemoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PlayerStackDemoUITests
    archive:
      config: Release
