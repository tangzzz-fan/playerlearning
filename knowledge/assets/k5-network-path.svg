<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" width="680" height="262" style="max-width:100%;height:auto" role="img">
<title>直播的两段与点播的一段</title>
<desc>推流把内容送到服务器、拉流把内容取到播放器；点播则省略推流那一段。</desc>

<defs>
  <marker id="n1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="26" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">直播是"两段"，点播是"一段"</text>

<rect x="40" y="56" width="160" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="120" y="80" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">源</text>
<text x="120" y="100" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">相机 / 采集卡 / 文件</text>

<rect x="260" y="56" width="160" height="64" rx="10" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="340" y="80" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">服务器</text>
<text x="340" y="100" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">mediamtx / CDN</text>

<rect x="480" y="56" width="160" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="560" y="80" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#3C3489" text-anchor="middle">播放器</text>
<text x="560" y="100" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#534AB7" text-anchor="middle">libmpv（我们）</text>

<path d="M202 88L258 88" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#n1)"/>
<text x="230" y="78" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">推流</text>

<path d="M422 88L478 88" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#n1)"/>
<text x="450" y="78" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#534AB7" text-anchor="middle">拉流</text>

<rect x="40" y="146" width="600" height="46" rx="8" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="164" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">产物的白名单实测支持：<tspan fill="#2C2C2A">推流侧</tspan> RTMP · RTSP · SRT　<tspan fill="#2C2C2A">拉流侧</tspan> RTSP · HLS · DASH · RTMP</text>
<text x="56" y="182" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">（另有 RIST 在 stream 层）—— 但**我们只做拉流那一侧**：推流是上游厂商的活</text>

<rect x="40" y="204" width="600" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="56" y="226" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3C3489">点播没有"推流"那一段：文件直接放在 HTTP 服务器上，播放器一步拉取（还要服务器支持 Range 请求）</text>
</svg>
