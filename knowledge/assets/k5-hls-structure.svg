<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" style="max-width:100%;height:auto" role="img">
<title>m3u8 的结构：一个清单套清单的文件</title>
<desc>master.m3u8 列出各档，每档一个 playlist，playlist 里列出分片；直播没有 ENDLIST 且清单滑动。</desc>

<defs>
  <marker id="n2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="26" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">m3u8 是纯文本：一个"清单套清单"的文件</text>

<rect x="40" y="50" width="150" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="115" y="72" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">master.m3u8</text>
<text x="115" y="90" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">列出有几档</text>

<rect x="240" y="42" width="170" height="34" rx="8" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="325" y="59" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#2C2C2A" text-anchor="middle">v0/index.m3u8 · 720p</text>
<rect x="240" y="86" width="170" height="34" rx="8" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="325" y="103" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#2C2C2A" text-anchor="middle">v1/index.m3u8 · 480p</text>
<rect x="240" y="130" width="170" height="34" rx="8" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="325" y="147" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#2C2C2A" text-anchor="middle">v2/index.m3u8 · 240p</text>

<path d="M192 76C216 76 216 59 238 59" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#n2)"/>
<path d="M192 76L238 103" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#n2)"/>
<path d="M192 76C216 76 216 147 238 147" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#n2)"/>

<text x="432" y="59" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">← 每档一个 playlist</text>
<text x="432" y="112" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">播放器只取它选中的那一档</text>

<rect x="240" y="186" width="170" height="34" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="325" y="203" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#27500A" text-anchor="middle">playlist（选中的那档）</text>

<rect x="240" y="236" width="30" height="26" rx="5" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<rect x="276" y="236" width="30" height="26" rx="5" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<rect x="312" y="236" width="30" height="26" rx="5" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<rect x="348" y="236" width="30" height="26" rx="5" fill="#97C459" stroke="#3B6D11" stroke-width="1"/>
<rect x="384" y="236" width="30" height="26" rx="5" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="399" y="249" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#888780" text-anchor="middle">?</text>

<text x="240" y="282" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">分片（每片几秒）：播放器按顺序取；<tspan fill="#3B6D11">绿色</tspan> = 当前在播，虚线 = 下一片</text>

<text x="440" y="203" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">点播（VOD）：清单末尾有</text>
<text x="440" y="219" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#2C2C2A">#EXT-X-ENDLIST　⇒ 分片固定</text>
<text x="440" y="243" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">直播（live）：<tspan font-weight="500">没有</tspan> ENDLIST ⇒</text>
<text x="440" y="259" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#2C2C2A">清单在滑动，旧分片会被删</text>
</svg>
