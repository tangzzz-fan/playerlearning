<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 274" width="680" height="274" style="max-width:100%;height:auto" role="img">
<title>两种接入方式：wid 嵌入与 render API</title>
<desc>wid 嵌入由 mpv 直接画进我们的图层，拿不到帧；render API 把帧交给回调，由我们自己画。</desc>

<text x="40" y="26" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">要处理画面，先解决"帧在谁手里" —— 这是架构级的分界线</text>

<rect x="40" y="42" width="290" height="26" rx="6" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="185" y="59" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle">现在：wid 嵌入</text>

<rect x="40" y="76" width="290" height="42" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="94" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#0C447C">mpv 直接画进我们的 CAMetalLayer</text>
<text x="56" y="110" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5">（我们只给了它一个图层指针）</text>

<rect x="40" y="126" width="290" height="42" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="56" y="144" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#501313">中间的数据我们<tspan font-weight="500">完全看不到</tspan></text>
<text x="56" y="160" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#A32D2D">⇒ 任何"对画面做处理"的需求都做不了</text>

<rect x="40" y="176" width="290" height="34" rx="8" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="197" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">✅ 极简：零渲染代码　❌ 拿不到帧</text>

<rect x="350" y="42" width="290" height="26" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="495" y="59" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="500" fill="#3C3489" text-anchor="middle">要拿帧：render API</text>

<rect x="350" y="76" width="290" height="42" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="366" y="94" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3C3489">mpv 把每一帧交给我们的回调</text>
<text x="366" y="110" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#534AB7">（纹理 / 像素缓冲，取决于后端）</text>

<rect x="350" y="126" width="290" height="42" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="366" y="144" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#27500A">我们处理（滤镜 / 2D→3D / AI）</text>
<text x="366" y="160" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11">然后画到自己的图层上</text>

<rect x="350" y="176" width="290" height="34" rx="8" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="366" y="197" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">✅ 帧在我们手里　❌ 要自己管渲染循环</text>

<rect x="40" y="222" width="600" height="34" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="56" y="244" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#633806">产物里已经导出 8 个 mpv_render_context_* 函数（含 create / update / render）—— 而我们的代码一行都没用</text>
</svg>
