<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" width="680" height="236" style="max-width:100%;height:auto" role="img">
<title>HTTPS 里"验证身份"的真正内容是三道检查</title>
<desc>证书必须链到受信任的根、名字与连接地址一致、且在有效期内用途正确；任何一道不过都必须拒绝。</desc>

<defs>
  <marker id="n3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="26" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">HTTPS = HTTP + TLS。TLS 做两件事：加密通道 · 验证对方身份</text>
<text x="40" y="44" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">"验证身份"不是一句话，而是下面三道检查 —— 任何一道不过，客户端都必须拒绝</text>

<rect x="40" y="60" width="180" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="84" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C">① 链</text>
<text x="56" y="104" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5">证书 → 中间证书 → 受信任的根</text>
<text x="56" y="120" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5">（根来自系统信任库）</text>

<rect x="250" y="60" width="180" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="266" y="84" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C">② 名字</text>
<text x="266" y="104" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5">证书里的 SAN</text>
<text x="266" y="120" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5">== 你实际连的地址</text>

<rect x="460" y="60" width="180" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="476" y="84" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C">③ 时效与用途</text>
<text x="476" y="104" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5">未过期 · 用途含 serverAuth</text>

<path d="M222 94L248 94" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#n3)"/>
<path d="M432 94L458 94" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#n3)"/>

<rect x="40" y="146" width="600" height="68" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="56" y="166" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#501313">⚠️ 本项目实测（2026-10-16）：修复前这三道<tspan font-weight="500">全不过也照播</tspan> —— 不是"判得松"，而是</text>
<text x="56" y="184" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#501313">那段校验代码<tspan font-weight="500">从未被执行</tspan>（上游默认值 + 我们没显式打开）。</text>
<text x="56" y="204" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#501313">判据：用"不受信任的自签证书"去连 —— 它<tspan font-weight="500">必须失败</tspan>。公网站点证不了这件事。</text>
</svg>
