<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 244" width="680" height="244" style="max-width:100%;height:auto" role="img">
<title>图形栈：Vulkan 为什么要绕到 Metal，硬解又从哪里汇入</title>
<desc>硬解产出像素缓冲，汇入 libplacebo，再经 Vulkan 调用、MoltenVK 翻译，最后画到 CAMetalLayer。</desc>

<defs>
  <marker id="g1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="26" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">这四个词不是竞品，是一条链上的不同层</text>

<rect x="40" y="44" width="250" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="56" y="62" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#633806">硬解：VideoToolbox（苹果的解码单元）</text>
<text x="56" y="78" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#854F0B">不在图形链上，在解码链上</text>

<path d="M292 66L318 66" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#g1)"/>

<rect x="320" y="44" width="320" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="336" y="62" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#633806">产出：CVPixelBuffer（带<tspan font-weight="500">兼容性标记</tspan>）</text>
<text x="336" y="78" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#854F0B">这个标记决定它能被哪种图形 API 直接用</text>

<path d="M480 90L480 126" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#g1)"/>

<rect x="40" y="130" width="104" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="92" y="152" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle">libplacebo</text>
<text x="92" y="170" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle">HDR · 缩放</text>

<rect x="163" y="130" width="104" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="215" y="152" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Vulkan 调用</text>
<text x="215" y="170" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">跨平台接口</text>

<rect x="286" y="130" width="104" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="338" y="152" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#3C3489" text-anchor="middle">MoltenVK</text>
<text x="338" y="170" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#534AB7" text-anchor="middle">翻译成 Metal</text>

<rect x="409" y="130" width="104" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="461" y="152" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Metal</text>
<text x="461" y="170" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">苹果的 GPU 接口</text>

<rect x="532" y="130" width="104" height="56" rx="8" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="584" y="152" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">CAMetalLayer</text>
<text x="584" y="170" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">我们的图层</text>

<path d="M144 158L161 158" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#g1)"/>
<path d="M267 158L284 158" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#g1)"/>
<path d="M390 158L407 158" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#g1)"/>
<path d="M513 158L530 158" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#g1)"/>

<text x="40" y="214" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">苹果不提供 Vulkan 驱动 ⇒ 想用 libplacebo 就必须经 MoltenVK 翻译一圈（产物里的 meson 配置实测：vulkan=enabled, moltenvk=enabled）</text>
<text x="40" y="232" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">旁证（动态依赖实测）：有 Metal.framework · QuartzCore · IOSurface；<tspan font-weight="500">没有 OpenGLES.framework</tspan>（GL 是运行时动态加载的）</text>
</svg>
