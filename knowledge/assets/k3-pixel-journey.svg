<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372" style="max-width:100%;height:auto" role="img">
<title>一帧像素的旅程：从 URL 到屏幕</title>
<desc>下行链：URL、stream 层、demux 拆包、decode 解码、原始帧；渲染链：时钟、vo=gpu-next、Vulkan 指令、MoltenVK、CAMetalLayer；另有一条向上的状态回传。</desc>

<defs>
  <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="a2p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="40" y="40" width="600" height="96" rx="12" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="60" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">下行 · 文件 → 帧</text>

<rect x="56" y="70" width="100" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="106" y="90" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">URL</text>
<text x="106" y="108" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">本地 / 网络流</text>

<rect x="173" y="70" width="100" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="223" y="90" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">stream 层</text>
<text x="223" y="108" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">只网络源有</text>

<rect x="290" y="70" width="100" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="90" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">demux 拆包</text>
<text x="340" y="108" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">libavformat</text>

<rect x="407" y="70" width="100" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="457" y="90" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">decode 解码</text>
<text x="457" y="108" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">ffmpeg 或 VT</text>

<rect x="524" y="70" width="100" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="574" y="90" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#3C3489" text-anchor="middle">原始帧</text>
<text x="574" y="108" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#534AB7" text-anchor="middle">YUV / 像素缓冲</text>

<path d="M156 96L171 96" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a2)"/>
<path d="M273 96L288 96" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a2)"/>
<path d="M390 96L405 96" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a2)"/>
<path d="M507 96L522 96" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a2)"/>

<path d="M340 136L340 168" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a2)"/>

<rect x="40" y="172" width="600" height="96" rx="12" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="192" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">渲染 · 帧 → 屏幕（前两站由 libmpv 决定，后三站一路翻到 Metal）</text>

<rect x="56" y="202" width="100" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="106" y="222" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle">时钟</text>
<text x="106" y="240" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle">决定何时上屏</text>

<rect x="173" y="202" width="100" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="223" y="222" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle">vo=gpu-next</text>
<text x="223" y="240" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle">libplacebo</text>

<rect x="290" y="202" width="100" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="222" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle">Vulkan 指令</text>
<text x="340" y="240" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle">渲染管线</text>

<rect x="407" y="202" width="100" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="457" y="222" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#633806" text-anchor="middle">MoltenVK</text>
<text x="457" y="240" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#854F0B" text-anchor="middle">翻成 Metal</text>

<rect x="524" y="202" width="100" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="574" y="222" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#633806" text-anchor="middle">CAMetalLayer</text>
<text x="574" y="240" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#854F0B" text-anchor="middle">我们的图层</text>

<path d="M156 228L171 228" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a2)"/>
<path d="M273 228L288 228" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a2)"/>
<path d="M390 228L405 228" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a2)"/>
<path d="M507 228L522 228" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a2)"/>

<rect x="40" y="288" width="600" height="68" rx="12" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="308" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">上行 · 状态回传（不参与画面，但决定界面显示什么）</text>

<rect x="56" y="318" width="220" height="28" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="166" y="336" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3C3489" text-anchor="middle">mpv_observe_property · 15 条</text>

<path d="M276 332L300 332" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a2p)"/>

<rect x="306" y="318" width="200" height="28" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="406" y="336" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3C3489" text-anchor="middle">我们的状态机 → SwiftUI</text>
</svg>
