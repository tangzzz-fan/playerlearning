<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" style="max-width:100%;height:auto" role="img">
<title>八个阶段与它们的判定门</title>
<desc>从风险排除到 macOS，每个阶段都有一个"凭什么算过关"的判定门。</desc>

<text x="40" y="26" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">八个阶段 —— 每阶段都有一个"凭什么算过关"的判定门</text>

<rect x="40" y="44" width="140" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="110" y="64" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">0 · 风险排除</text>
<text x="110" y="84" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">判定 G0</text>
<text x="110" y="102" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">真机冒烟通过</text>

<rect x="190" y="44" width="140" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="260" y="64" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">1 · 骨架与抽象</text>
<text x="260" y="84" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">判定 G1</text>
<text x="260" y="102" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">内核零 UI import</text>

<rect x="340" y="44" width="140" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="410" y="64" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">2 · 内核接入</text>
<text x="410" y="84" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">判定 G2</text>
<text x="410" y="102" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">出画 + 出声 + seek</text>

<rect x="490" y="44" width="140" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="560" y="64" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">3 · UI 闭环</text>
<text x="560" y="84" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">判定 G3</text>
<text x="560" y="102" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">五个操作能用手做</text>

<rect x="40" y="140" width="140" height="76" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="110" y="160" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle">4 · 字幕</text>
<text x="110" y="180" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle">判定 G4</text>
<text x="110" y="198" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle">中文不乱码 · 特效</text>

<rect x="190" y="140" width="140" height="76" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="260" y="160" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle">5 · 网络点播</text>
<text x="260" y="180" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle">判定 G5</text>
<text x="260" y="198" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle">弱网不崩 · 恢复继续</text>

<rect x="340" y="140" width="140" height="76" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="410" y="160" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#633806" text-anchor="middle">6 · 直播</text>
<text x="410" y="180" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#854F0B" text-anchor="middle">无独立判定门</text>
<text x="410" y="198" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#854F0B" text-anchor="middle">真机打通 + 延迟可量化</text>

<rect x="490" y="140" width="140" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="560" y="160" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#3C3489" text-anchor="middle">7 · macOS</text>
<text x="560" y="180" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#534AB7" text-anchor="middle">判定 G7</text>
<text x="560" y="198" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#534AB7" text-anchor="middle">同一包零改动编译</text>

<text x="40" y="242" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">顺序的两条规矩：<tspan font-weight="500">先做风险最大的</tspan>（所以 Phase 0 是 Spike、不是写代码）·</text>
<text x="40" y="260" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A"><tspan font-weight="500">先立边界再实现</tspan>（所以 Phase 1 只有抽象、一行业务代码都没有）</text>
<text x="40" y="282" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#888780">判定门的判据一律是"能观察到的事实"，不是"代码写完了"</text>
</svg>
